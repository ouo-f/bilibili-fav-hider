<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 340px; margin: 0; padding: 14px; box-sizing: border-box;
      font: 13px/1.6 system-ui, "Microsoft YaHei", sans-serif; color: #222;
    }
    h1 { font-size: 15px; margin: 0 0 8px; }
    textarea {
      width: 100%; height: 130px; box-sizing: border-box; padding: 8px;
      border: 1px solid #ccc; border-radius: 6px;
      font: 12px/1.5 Consolas, monospace; resize: vertical;
    }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    button {
      flex: 1; padding: 7px 0; border: 0; border-radius: 6px;
      background: #fb7299; color: #fff; font-size: 13px; cursor: pointer;
    }
    button:hover { background: #fc8bab; }
    label { display: flex; align-items: center; gap: 4px; color: #666; }
    #tip { color: #2a9d5c; font-size: 12px; margin-top: 8px; display: none; }
    details { margin-top: 10px; color: #666; font-size: 12px; }
    summary { cursor: pointer; user-select: none; }
    details p { margin: 6px 0; }
    code { background: #f2f2f2; padding: 0 4px; border-radius: 4px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>🎬 b站收藏夹助手</h1>
  <textarea id="rules" placeholder="每行一条：
123456   ← 收藏夹 fid（推荐）
关键字   ← 或标题关键字"></textarea>
  <div class="row" style="justify-content: space-between;">
    <label><input type="checkbox" id="hideNav">兜底：隐藏整个顶栏面板</label>
    <label><input type="checkbox" id="debug">调试日志</label>
  </div>
  <div class="row">
    <button id="save">保存</button>
  </div>
  <div id="tip">已保存 ✓ 刷新B站页面后生效</div>
  <details>
    <summary>如何获取 fid？</summary>
    <p>打开想隐藏的收藏夹，地址栏形如
      <code>space.bilibili.com/你的UID/favlist?fid=123456</code>，
      <code>fid=</code> 后面的数字就是 fid。</p>
    <p>纯数字行按 fid 精确隐藏（侧栏/卡片/直链都生效）；文字行按标题关键字匹配（视频页收藏弹窗里只能按标题）。保存后刷新B站页面生效。</p>
  </details>
  <details>
    <summary>诊断工具（排查顶栏面板问题时使用）</summary>
    <p style="margin:6px 0;">在B站页面悬停“收藏”让面板出现，然后点下方按钮，把复制到的内容发给开发者。</p>
    <button id="dump" style="width:100%;font-size:12px;">复制面板结构（自动脱敏）</button>
    <textarea id="dumpOut" style="display:none;width:100%;height:80px;margin-top:6px;font:11px Consolas,monospace;"></textarea>
  </details>
  <script src="popup.js"></script>
</body>
</html>
